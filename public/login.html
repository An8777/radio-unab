<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RADIO UNAB — Acceso Locutor</title>
  <link rel="icon" href="/img/logo.jpg" type="image/jpeg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #07070f;
      --surface: #0d0d1e;
      --card:    #11112a;
      --border:  #1e1e45;
      --acc:     #e94560;
      --acc2:    #ff6b85;
      --txt:     #f0f0ff;
      --txt2:    #8080b0;
      --txt3:    #40406a;
      --green:   #1db954;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{
      height:100%;font-family:'Inter',sans-serif;
      background:var(--bg);color:var(--txt);
      display:flex;align-items:center;justify-content:center;
    }
    body::before{
      content:"";position:fixed;inset:0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(233,69,96,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(124,92,191,0.08) 0%, transparent 60%);
      pointer-events:none;
    }

    .login-box{
      width:100%;max-width:420px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:20px;padding:40px 36px;
      position:relative;z-index:1;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }

    .brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
    .brand-icon{
      width:46px;height:46px;border-radius:12px;
      background:rgba(233,69,96,0.15);border:1px solid rgba(233,69,96,0.3);
      display:flex;align-items:center;justify-content:center;color:var(--acc);
    }
    .brand-name{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:0.1em}
    .brand-sub{font-size:0.7rem;color:var(--txt2);letter-spacing:0.05em;margin-top:1px}

    .tabs{display:flex;background:var(--card);border-radius:10px;padding:4px;margin-bottom:28px}
    .tab{
      flex:1;padding:9px;border:none;background:none;
      color:var(--txt2);font-size:0.82rem;font-weight:600;
      border-radius:8px;cursor:pointer;transition:all 0.2s;font-family:inherit;
    }
    .tab.active{background:var(--acc);color:#fff}

    .form-panel{display:none}
    .form-panel.active{display:block}

    .field-group{margin-bottom:16px}
    .field-label{
      display:block;font-size:0.72rem;font-weight:600;
      color:var(--txt2);letter-spacing:0.05em;margin-bottom:6px;
    }
    .field{
      width:100%;background:var(--card);
      border:1.5px solid var(--border);
      border-radius:10px;padding:12px 16px;
      color:var(--txt);font-size:0.9rem;font-family:inherit;
      outline:none;transition:border-color 0.15s,box-shadow 0.15s;
    }
    .field:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(233,69,96,0.15)}
    .field::placeholder{color:var(--txt3)}

    .btn-submit{
      width:100%;padding:13px;border:none;border-radius:10px;
      background:linear-gradient(135deg,var(--acc) 0%,#c0304a 100%);
      color:#fff;font-size:0.9rem;font-weight:700;
      cursor:pointer;font-family:inherit;margin-top:4px;
      box-shadow:0 4px 20px rgba(233,69,96,0.35);
      transition:transform 0.15s,box-shadow 0.15s;
    }
    .btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 26px rgba(233,69,96,0.5)}
    .btn-submit:active{transform:translateY(0)}
    .btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none}

    .msg{
      margin-top:16px;padding:11px 14px;border-radius:8px;
      font-size:0.82rem;font-weight:500;text-align:center;display:none;
    }
    .msg.error{background:rgba(233,69,96,0.12);border:1px solid rgba(233,69,96,0.3);color:var(--acc2)}
    .msg.success{background:rgba(29,185,84,0.1);border:1px solid rgba(29,185,84,0.3);color:var(--green)}
    .msg.show{display:block}

    .divider{
      text-align:center;color:var(--txt3);font-size:0.72rem;
      margin:20px 0;position:relative;
    }
    .divider::before,.divider::after{
      content:"";position:absolute;top:50%;width:42%;height:1px;background:var(--border);
    }
    .divider::before{left:0} .divider::after{right:0}
  </style>
</head>
<body>

<div class="login-box">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 40 40" width="24" height="24" fill="none">
        <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
        <path d="M14 20 Q20 8 26 20 Q20 32 14 20Z" fill="currentColor" opacity="0.8"/>
        <circle cx="20" cy="20" r="3" fill="currentColor"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">RADIO UNAB</div>
      <div class="brand-sub">ACCESO LOCUTOR</div>
    </div>
  </div>

  <!-- Login -->
  <div class="form-panel active" id="panel-login">
    <form id="form-login" autocomplete="off">
      <div class="field-group">
        <label class="field-label" for="login-usuario">Usuario</label>
        <input type="text" id="login-usuario" class="field" placeholder="Tu nombre de usuario" required/>
      </div>
      <div class="field-group">
        <label class="field-label" for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" class="field" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-submit" id="btn-login">Entrar a Cabina</button>
    </form>
    <div class="msg" id="msg-login"></div>
  </div>
</div>

<script>
  function mostrarMsg(id, texto, tipo) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.className = `msg ${tipo} show`;
  }

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Verificando...';
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        usuario: document.getElementById('login-usuario').value.trim(),
        password: document.getElementById('login-pass').value
      })
    });
    const data = await res.json();
    if (res.ok) {
      mostrarMsg('msg-login', '✅ Acceso concedido, entrando...', 'success');
      setTimeout(() => window.location.href = '/locutor', 800);
    } else {
      mostrarMsg('msg-login', '❌ ' + data.error, 'error');
      btn.disabled = false; btn.textContent = 'Entrar a Cabina';
    }
  });
</script>

</body>
</html>
