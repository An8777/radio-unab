<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RADIO UNAB — Gestión de Locutores</title>
  <link rel="icon" href="/img/logo.jpg" type="image/jpeg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #07070f;
      --surface: #0d0d1e;
      --card:    #11112a;
      --border:  #1e1e45;
      --acc:     #e94560;
      --acc2:    #ff6b85;
      --txt:     #f0f0ff;
      --txt2:    #8080b0;
      --txt3:    #40406a;
      --green:   #1db954;
      --purple:  #7c5cbf;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt)}
    body::before{
      content:"";position:fixed;inset:0;
      background:radial-gradient(ellipse 80% 60% at 20% 20%, rgba(233,69,96,0.08) 0%, transparent 60%);
      pointer-events:none;
    }

    .wrap{max-width:560px;margin:0 auto;padding:40px 20px;position:relative;z-index:1}

    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-icon{
      width:40px;height:40px;border-radius:10px;
      background:rgba(233,69,96,0.12);border:1px solid rgba(233,69,96,0.3);
      display:flex;align-items:center;justify-content:center;color:var(--acc);
    }
    .brand-name{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.1em}
    .brand-sub{font-size:0.65rem;color:var(--txt2);letter-spacing:0.05em}

    .btn-back{
      display:flex;align-items:center;gap:6px;
      padding:8px 14px;border-radius:8px;
      background:var(--card);border:1px solid var(--border);
      color:var(--txt2);font-size:0.78rem;font-weight:600;
      text-decoration:none;transition:color 0.15s,border-color 0.15s;
    }
    .btn-back:hover{color:var(--txt);border-color:var(--acc)}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:24px}
    .card-title{font-size:0.8rem;font-weight:700;letter-spacing:0.08em;color:var(--acc);text-transform:uppercase;margin-bottom:20px}

    .field-group{margin-bottom:14px}
    .field-label{display:block;font-size:0.72rem;font-weight:600;color:var(--txt2);margin-bottom:5px}
    .field{
      width:100%;background:var(--card);border:1.5px solid var(--border);
      border-radius:9px;padding:11px 14px;
      color:var(--txt);font-size:0.875rem;font-family:inherit;outline:none;
      transition:border-color 0.15s,box-shadow 0.15s;
    }
    .field:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(233,69,96,0.12)}
    .field::placeholder{color:var(--txt3)}

    .btn-submit{
      width:100%;padding:12px;border:none;border-radius:9px;
      background:linear-gradient(135deg,var(--acc) 0%,#c0304a 100%);
      color:#fff;font-size:0.875rem;font-weight:700;
      cursor:pointer;font-family:inherit;margin-top:4px;
      box-shadow:0 4px 16px rgba(233,69,96,0.3);
      transition:transform 0.15s,box-shadow 0.15s;
    }
    .btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(233,69,96,0.45)}
    .btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none}

    .msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:0.82rem;font-weight:500;display:none}
    .msg.error{background:rgba(233,69,96,0.1);border:1px solid rgba(233,69,96,0.3);color:var(--acc2)}
    .msg.success{background:rgba(29,185,84,0.08);border:1px solid rgba(29,185,84,0.25);color:var(--green)}
    .msg.show{display:block}

    /* Lista de locutores */
    .locutor-item{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 0;border-bottom:1px solid var(--border);
    }
    .locutor-item:last-child{border-bottom:none}
    .locutor-info{display:flex;align-items:center;gap:12px}
    .locutor-av{
      width:36px;height:36px;border-radius:50%;
      background:linear-gradient(135deg,var(--purple),var(--acc));
      display:flex;align-items:center;justify-content:center;
      font-size:0.75rem;font-weight:800;color:#fff;flex-shrink:0;
    }
    .locutor-nombre{font-size:0.875rem;font-weight:600}
    .locutor-usuario{font-size:0.72rem;color:var(--txt2);margin-top:2px}
    .btn-eliminar{
      padding:6px 12px;border-radius:7px;border:1px solid rgba(233,69,96,0.25);
      background:rgba(233,69,96,0.08);color:var(--acc);
      font-size:0.75rem;font-weight:600;cursor:pointer;font-family:inherit;
      transition:background 0.15s;
    }
    .btn-eliminar:hover{background:rgba(233,69,96,0.2)}
    .empty{color:var(--txt3);font-size:0.82rem;text-align:center;padding:16px 0}
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 40 40" width="22" height="22" fill="none">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
          <path d="M14 20 Q20 8 26 20 Q20 32 14 20Z" fill="currentColor" opacity="0.8"/>
          <circle cx="20" cy="20" r="3" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">RADIO UNAB</div>
        <div class="brand-sub">GESTIÓN DE LOCUTORES</div>
      </div>
    </div>
    <a href="/locutor" class="btn-back">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Volver
    </a>
  </div>

  <!-- Crear nuevo locutor -->
  <div class="card">
    <div class="card-title">➕ Crear nuevo locutor</div>
    <form id="form-registro" autocomplete="off">
      <div class="field-group">
        <label class="field-label" for="reg-usuario">Usuario</label>
        <input type="text" id="reg-usuario" class="field" placeholder="nombre_locutor" required/>
      </div>
      <div class="field-group">
        <label class="field-label" for="reg-nombre">Nombre completo</label>
        <input type="text" id="reg-nombre" class="field" placeholder="Nombre real" required/>
      </div>
      <div class="field-group">
        <label class="field-label" for="reg-pass">Contraseña</label>
        <input type="password" id="reg-pass" class="field" placeholder="Mínimo 6 caracteres" required minlength="6"/>
      </div>
      <div class="field-group">
        <label class="field-label" for="reg-pass2">Confirmar contraseña</label>
        <input type="password" id="reg-pass2" class="field" placeholder="Repite la contraseña" required/>
      </div>
      <button type="submit" class="btn-submit" id="btn-crear">Crear Locutor</button>
    </form>
    <div class="msg" id="msg-registro"></div>
  </div>

  <!-- Lista de locutores -->
  <div class="card">
    <div class="card-title">🎙️ Locutores registrados</div>
    <div id="lista-locutores"><div class="empty">Cargando...</div></div>
  </div>

</div>

<script>
  function mostrarMsg(id, texto, tipo) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.className = `msg ${tipo} show`;
  }

  async function cargarLocutores() {
    const res = await fetch('/auth/locutores');
    if (!res.ok) return;
    const data = await res.json();
    const lista = document.getElementById('lista-locutores');
    if (data.length === 0) { lista.innerHTML = '<div class="empty">No hay locutores registrados</div>'; return; }
    lista.innerHTML = data.map(l => `
      <div class="locutor-item" id="loc-${l.id}">
        <div class="locutor-info">
          <div class="locutor-av">${l.nombre[0].toUpperCase()}</div>
          <div>
            <div class="locutor-nombre">${l.nombre}</div>
            <div class="locutor-usuario">@${l.usuario}</div>
          </div>
        </div>
        <button class="btn-eliminar" onclick="eliminar(${l.id}, '${l.usuario}')">Eliminar</button>
      </div>
    `).join('');
  }

  async function eliminar(id, usuario) {
    if (!confirm(`¿Eliminar al locutor @${usuario}?`)) return;
    const res = await fetch(`/auth/locutores/${id}`, { method: 'DELETE' });
    if (res.ok) {
      document.getElementById(`loc-${id}`)?.remove();
      const lista = document.getElementById('lista-locutores');
      if (!lista.querySelector('.locutor-item')) lista.innerHTML = '<div class="empty">No hay locutores registrados</div>';
    }
  }

  document.getElementById('form-registro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pass  = document.getElementById('reg-pass').value;
    const pass2 = document.getElementById('reg-pass2').value;
    if (pass !== pass2) return mostrarMsg('msg-registro', '❌ Las contraseñas no coinciden', 'error');
    const btn = document.getElementById('btn-crear');
    btn.disabled = true; btn.textContent = 'Creando...';
    const res = await fetch('/auth/registro', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        usuario:  document.getElementById('reg-usuario').value.trim(),
        nombre:   document.getElementById('reg-nombre').value.trim(),
        password: pass
      })
    });
    const data = await res.json();
    if (res.ok) {
      mostrarMsg('msg-registro', '✅ Locutor creado exitosamente', 'success');
      document.getElementById('form-registro').reset();
      cargarLocutores();
    } else {
      mostrarMsg('msg-registro', '❌ ' + data.error, 'error');
    }
    btn.disabled = false; btn.textContent = 'Crear Locutor';
  });

  cargarLocutores();
</script>
</body>
</html>
